<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/antikopas-favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AntiKopas - Analisis kemiripan dokumen akademik" />
    <title>AntiKopas</title>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var theme = params.get('theme') || localStorage.getItem('antikopas_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
